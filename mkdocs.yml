site_name: Monocular BEV Localization
site_url: https://amelie-png.github.io/monocular-bev-localization/
site_description: Undergraduate Research Project
site_author: Amelie Zhang

theme:
  name: material

  custom_dir: overrides

  logo: assets/logo.svg
  favicon: assets/favicon.png

  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.instant.preview
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - toc.follow
    - search.highlight
    - search.suggest

  palette:
    # Light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

repo_name: Amelie-png/monocular-bev-localization
repo_url: https://github.com/Amelie-png/monocular-bev-localization

nav:
  - Home: index.md
  - Project Report:
      - Data Collection: report/data_collection.md
      - Methodology: report/methodology.md
      - Results: report/results.md
      - Discussion: report/discussion.md
      - Conclusion: report/conclusion.md
  - Development Log: log.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: pipeline
          class: pipeline-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js
  - javascripts/pipeline.js
  - javascripts/image_carousel.js

extra_css:
  - stylesheets/extra.css
